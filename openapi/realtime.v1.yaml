        "responses": {
          "202": {
            "description": "Accepted"
          },
          "409": {
            "description": "Replay rejected"
          },
          "422": {
            "description": "Invalid legacy event"
          }
        }
      }
    },
    "/v1/applications": {
      "get": {
        "summary": "List applications",
