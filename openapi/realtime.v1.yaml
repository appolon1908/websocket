{
  "openapi": "3.1.0",
  "info": {
    "title": "Codestra Realtime API",
    "version": "2.0.0"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8787"
    }
  ],
  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "request_id"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              }
            }
          }
        }
      },
      "Channel": {
        "type": "object",
        "required": [
          "name",
          "tenant_id",
          "retention",
          "created_at"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "tenant_id": {
            "type": "string"
          },
          "retention": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "EventInput": {
        "type": "object",
        "required": [
          "channel",
          "type",
          "data"
        ],
        "properties": {
          "channel": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "data": {},
          "correlation_id": {
            "type": "string",
            "format": "uuid"
          },
          "causation_id": {
            "type": "string",
            "format": "uuid"
          },
          "trace_id": {
            "type": "string"
          }
        }
      },
      "Event": {
        "type": "object",
        "required": [
          "id",
          "sequence",
          "channel",
          "type",
          "timestamp",
          "source",
          "tenant_id",
          "data"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "sequence": {
            "type": "integer",
            "minimum": 1
          },
          "channel": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          },
          "source": {
            "type": "string"
          },
          "tenant_id": {
            "type": "string"
          },
          "correlation_id": {
            "type": "string",
            "format": "uuid"
          },
          "causation_id": {
            "type": "string",
            "format": "uuid"
          },
          "trace_id": {
            "type": "string"
          },
          "data": {}
        }
      },
      "ApiKeyMetadata": {
        "type": "object",
        "required": [
          "id",
          "prefix",
          "owner",
          "tenant_id",
          "permissions",
          "created_at"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "prefix": {
            "type": "string"
          },
          "owner": {
            "type": "string"
          },
          "tenant_id": {
            "type": "string"
          },
          "permissions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "expires_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "last_used_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "revoked_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "ApiKeyIssued": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ApiKeyMetadata"
          },
          {
            "type": "object",
            "required": [
              "api_key"
            ],
            "properties": {
              "api_key": {
                "type": "string"
              }
            }
          }
        ]
      }
    }
  },
  "security": [
    {
      "BearerAuth": []
    }
  ],
  "paths": {
    "/health/live": {
      "get": {
        "security": [],
        "summary": "Liveness",
        "responses": {
          "200": {
            "description": "Process is live"
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "security": [],
        "summary": "Readiness",
        "responses": {
          "200": {
            "description": "Enabled dependencies are ready"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        }
      }
    },
    "/healthz": {
      "get": {
        "security": [],
        "deprecated": true,
        "summary": "Legacy health compatibility",
        "responses": {
          "200": {
            "description": "Legacy health"
          }
        }
      }
    },
    "/v1/system/info": {
      "get": {
        "security": [],
        "summary": "System information",
        "responses": {
          "200": {
            "description": "System information"
          }
        }
      }
    },
    "/v1/system/capabilities": {
      "get": {
        "security": [],
        "summary": "Capabilities",
        "responses": {
          "200": {
            "description": "Capability flags"
          }
        }
      }
    },
    "/v1/system/version": {
      "get": {
        "security": [],
        "summary": "Version",
        "responses": {
          "200": {
            "description": "Version"
          }
        }
      }
    },
    "/v1/api-keys": {
      "get": {
        "summary": "List API keys",
        "responses": {
          "200": {
            "description": "API key metadata"
          }
        }
      },
      "post": {
        "summary": "Create API key",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "permissions"
                ],
                "properties": {
                  "owner": {
                    "type": "string"
                  },
                  "permissions": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "expires_at": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "format": "date-time"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "API key issued",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiKeyIssued"
                }
              }
            }
          }
        }
      }
    },
    "/v1/api-keys/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-f0-9]{16}$"
          }
        }
      ],
      "delete": {
        "summary": "Revoke API key",
        "responses": {
          "204": {
            "description": "Revoked"
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/v1/api-keys/{id}/rotate": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-f0-9]{16}$"
          }
        }
      ],
      "post": {
        "summary": "Rotate API key",
        "responses": {
          "201": {
            "description": "Replacement API key issued"
          },
          "404": {
            "description": "Not found"
          },
          "409": {
            "description": "Already revoked"
          }
        }
      }
    },
    "/v1/channels": {
      "get": {
        "summary": "List channels",
        "responses": {
          "200": {
            "description": "Channels"
          }
        }
      },
      "post": {
        "summary": "Create channel",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "name"
                ],
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "retention": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Channel created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Channel"
                }
              }
            }
          },
          "409": {
            "description": "Already exists"
          }
        }
      }
    },
    "/v1/channels/{channel}": {
      "parameters": [
        {
          "name": "channel",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "summary": "Get channel",
        "responses": {
          "200": {
            "description": "Channel"
          },
          "404": {
            "description": "Not found"
          }
        }
      },
      "delete": {
        "summary": "Delete channel",
        "responses": {
          "204": {
            "description": "Deleted"
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/v1/channels/{channel}/events": {
      "parameters": [
        {
          "name": "channel",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "summary": "Read channel event history",
        "parameters": [
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "before",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 500
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "type",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Event history"
          }
        }
      }
    },
    "/v1/events": {
      "post": {
        "summary": "Publish event",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EventInput"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Event accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Event"
                }
              }
            }
          },
          "404": {
            "description": "Channel not found"
          }
        }
      }
    },
    "/v1/events/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "get": {
        "summary": "Get event",
        "responses": {
          "200": {
            "description": "Event",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Event"
                }
              }
            }
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/events": {
      "post": {
        "deprecated": true,
        "summary": "Legacy Mission Control event ingest",
        "responses": {
          "202": {
            "description": "Accepted"
          },
          "409": {
            "description": "Replay rejected"
          },
          "422": {
            "description": "Invalid legacy event"
          }
        }
      }
    }
  }
}
